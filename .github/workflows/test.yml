name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite drives a real VS Code; a wedged GUI would otherwise sit until
    # the 6h default job timeout.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` runs the pretest script (compile-tests, compile, lint) and then
      # vscode-test, which downloads and launches a real VS Code. That needs a
      # display even though nothing is interactive, hence xvfb-run.
      - name: Run tests
        run: xvfb-run -a npm test
